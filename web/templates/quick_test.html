{% extends "base.html" %}
{% block content %}
<div class="page-header" style="margin-bottom: 12px;">
    <h2 data-i18n="qt.title">快速测试</h2>
    <p class="text-muted" data-i18n="qt.subtitle">测试 AI Agent 功能并查看实时结果</p>
</div>

<!-- Top row: Run Log + LLM Log + Todo side by side -->
<div class="qt-panels">
    <div class="card qt-panel" id="logPanel">
        <div class="card-header" style="border-bottom: none; padding: 10px 16px; flex-shrink: 0;">
            <h3 style="font-size: 14px;" data-i18n="qt.tabLog">运行日志</h3>
            <div class="log-controls" style="margin-bottom: 0;">
                <label><span data-i18n="qt.logLines">显示行数：</span>
                    <select id="logLines" onchange="loadRunLog()">
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                        <option value="0" selected data-i18n="qt.logAll">全部</option>
                    </select>
                </label>
                <label>
                    <input type="checkbox" id="autoRefreshLog" checked onchange="toggleAutoRefreshLog()">
                    <span data-i18n="qt.autoRefresh">自动刷新</span>
                </label>
                <button class="btn btn-sm btn-outline" onclick="loadRunLog()" data-i18n="qt.refresh">🔄 刷新</button>
                <button class="btn btn-sm btn-outline" onclick="exportRunLog()" data-i18n="qt.exportLog">📥 导出</button>
            </div>
        </div>
        <div class="card-body" style="padding: 0; flex: 1; min-height: 0; overflow: hidden;">
            <div id="runLogContainer" class="log-container"></div>
        </div>
    </div>

    <div class="card qt-panel" id="llmPanel">
        <div class="card-header" style="border-bottom: none; padding: 10px 16px; flex-shrink: 0;">
            <h3 style="font-size: 14px;" data-i18n="qt.tabLlm">LLM日志</h3>
            <div class="llm-log-controls" style="margin-bottom: 0;">
                <label>
                    <input type="checkbox" id="llmAutoScroll" checked>
                    <span data-i18n="qt.autoScroll">自动滚动</span>
                </label>
                <button class="btn btn-sm btn-outline" onclick="exportLlmLog()" data-i18n="qt.exportLog">📥 导出</button>
                <button class="btn btn-sm btn-outline" onclick="clearLlmLog()" data-i18n="qt.clearLog">🗑️ 清屏</button>
            </div>
        </div>
        <div class="card-body" style="padding: 0; flex: 1; min-height: 0; overflow: hidden;">
            <div id="llmLogContainer" class="log-container llm-log-container"></div>
        </div>
    </div>

    <div id="todoCard" class="card qt-panel" style="width: 200px; flex: 0 0 200px;">
        <div class="card-header" style="border-bottom: none; padding: 10px 16px; flex-shrink: 0;">
            <h3 style="font-size: 14px;" data-i18n="qt.tabTodo">任务清单</h3>
        </div>
        <div class="card-body" style="padding: 0 12px 12px; flex: 1; min-height: 0; overflow-y: auto;">
            <div id="todoTreeContainer">
                <div class="todo-empty" data-i18n="qt.noTasks">暂无任务</div>
            </div>
        </div>
    </div>
</div>

<!-- Middle row: Final Result -->
<div class="card" id="resultCard">
    <div class="card-header" style="padding: 10px 16px;">
        <div style="display: flex; gap: 8px; align-items: center;">
            <h3 style="font-size: 14px;" data-i18n="qt.tabResult">最终结果</h3>
            <span class="badge" id="resultStatus" data-i18n="qt.idle">空闲</span>
            <span class="badge badge-info" id="resultIntent"></span>
        </div>
        <button class="btn btn-sm btn-outline" id="copyBtn" data-i18n="qt.copy">📋 复制</button>
    </div>
    <div class="card-body" style="padding: 0;">
        <div id="finalResultContainer" class="result-box" style="min-height: 60px;">
            <span class="text-muted" data-i18n="qt.waitingResult">等待请求...</span>
        </div>
        <div id="resultFiles" class="file-list"></div>
    </div>
</div>

<!-- Bottom row: Request Input -->
<div class="card">
    <div class="card-body" style="padding-top: 16px;">
        <form id="testForm">
            <div style="display: flex; gap: 12px; align-items: center;">
                <select id="requestType" class="form-control" style="width: 140px; margin: 0;">
                    <option value="auto" data-i18n="qt.autoDetect">自动识别</option>
                    <option value="research" data-i18n="qt.smartSearch">智能搜索</option>
                    <option value="ppt" data-i18n="qt.pptGeneration">PPT生成</option>
                    <option value="coding" data-i18n="qt.codingGeneration">代码生成</option>
                </select>
                <textarea id="requestInput" class="form-control" rows="1" style="flex: 1; margin: 0;"
                    placeholder="请输入您的请求..." data-i18n-placeholder="qt.requestPlaceholder"></textarea>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="btnText" data-i18n="qt.sendRequest">发送请求</span>
                    <span id="btnSpinner" class="spinner hidden">⟳</span>
                </button>
                <button type="button" class="btn btn-outline" id="cancelBtn" style="display: none;">
                    <span data-i18n="qt.cancel">取消</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/quick_test.js"></script>
{% endblock %}
