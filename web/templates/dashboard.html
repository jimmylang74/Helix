{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2 data-i18n="dashboard.title">仪表盘</h2>
    <p class="text-muted" data-i18n="dashboard.subtitle">AI Agent 混合驱动智能服务控制台</p>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon">🔄</div>
        <div class="stat-info">
            <h3 id="totalRequests">0</h3>
            <p data-i18n="dashboard.totalRequests">总请求数</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-info">
            <h3 id="successfulRequests">0</h3>
            <p data-i18n="dashboard.successfulRequests">成功请求</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">❌</div>
        <div class="stat-info">
            <h3 id="failedRequests">0</h3>
            <p data-i18n="dashboard.failedRequests">失败请求</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">📄</div>
        <div class="stat-info">
            <h3 id="generatedFiles">0</h3>
            <p data-i18n="dashboard.generatedFiles">生成文件</p>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3 data-i18n="dashboard.systemInfo">系统信息</h3>
    </div>
    <div class="card-body">
        <div class="info-grid" id="systemInfo">
            <div class="info-item">
                <label data-i18n="dashboard.llmProvider">LLM 提供商</label>
                <span id="llmProvider">-</span>
            </div>
            <div class="info-item">
                <label data-i18n="dashboard.llmModel">LLM 模型</label>
                <span id="llmModel">-</span>
            </div>
            <div class="info-item">
                <label data-i18n="dashboard.servicePort">服务端口</label>
                <span id="servicePort">-</span>
            </div>
            <div class="info-item">
                <label data-i18n="dashboard.adminPort">管理端口</label>
                <span id="adminPort">-</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
