{% extends "base.html" %}
{% block content %}
<div class="page-header" style="margin-bottom: 12px;">
    <h2 data-i18n="qt.title">快速测试</h2>
    <p class="text-muted" data-i18n="qt.subtitle">测试 AI Agent 功能并查看实时结果</p>
</div>

<!-- Top row: Final Result + Run/LLM Log (tabs) + Todo side by side -->
<div class="qt-panels">
    <div class="card qt-panel" id="resultCard">
        <div class="card-header" style="padding: 10px 16px; justify-content: flex-start; gap: 12px; flex-wrap: wrap;">
            <h3 style="font-size: 14px; flex-shrink: 0;" data-i18n="qt.tabResult">最终结果</h3>
            <div class="token-usage-inline">
                <span class="token-usage-item">
                    <span data-i18n="qt.inputTokens">输入 token</span>（<span data-i18n="qt.currentTotal">当前/总计</span>）：
                    <strong id="tokenInput" class="token-usage-value">0/0</strong>
                </span>
                <span class="token-usage-item">
                    <span data-i18n="qt.outputTokens">输出 token</span>（<span data-i18n="qt.currentTotal">当前/总计</span>）：
                    <strong id="tokenOutput" class="token-usage-value">0/0</strong>
                </span>
                <span class="token-usage-item">
                    <span data-i18n="qt.tokenizer">分词器</span>：
                    <strong id="tokenizerName" class="token-usage-value">-</strong>
                </span>
            </div>
            <button class="btn btn-sm btn-outline" id="copyBtn" style="margin-left: auto;" data-i18n="qt.copy">📋 复制</button>
        </div>
        <div class="card-body" style="padding: 0;">
            <div id="finalResultContainer" class="result-box" style="min-height: 60px;">
                <span class="text-muted" data-i18n="qt.waitingResult">等待请求...</span>
            </div>
            <div id="resultFiles" class="file-list"></div>
        </div>
    </div>

    <!-- Combined card: Run Log + LLM Log as tabs (at the original LLM Log position) -->
    <div class="card qt-panel" id="logPanel">
        <div class="card-header" style="border-bottom: none; padding: 6px 16px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;">
            <div class="tabs qt-log-tabs" role="tablist">
                <button class="tab-btn active" data-tab="runlog" data-i18n="qt.tabLog" role="tab">运行日志</button>
                <button class="tab-btn" data-tab="llmlog" data-i18n="qt.tabLlm" role="tab">LLM日志</button>
            </div>
            <div class="log-controls qt-tab-controls" id="controls-runlog" style="margin: 0;">
                <label>
                    <input type="checkbox" id="autoRefreshLog" checked onchange="toggleAutoRefreshLog()">
                    <span data-i18n="qt.autoRefresh">自动刷新</span>
                </label>
                <button class="btn btn-sm btn-outline" onclick="restartLogStream()" data-i18n="qt.refresh">🔄 刷新</button>
                <button class="btn btn-sm btn-outline" onclick="exportRunLog()" data-i18n="qt.exportLog">📥 导出</button>
            </div>
            <div class="llm-log-controls qt-tab-controls" id="controls-llmlog" style="margin: 0; display: none;">
                <label>
                    <input type="checkbox" id="llmAutoScroll" checked>
                    <span data-i18n="qt.autoScroll">自动滚动</span>
                </label>
                <label>
                    <input type="checkbox" id="llmAutoSave" checked>
                    <span data-i18n="qt.autoSave">自动保存</span>
                </label>
                <button class="btn btn-sm btn-outline" onclick="exportLlmLog()" data-i18n="qt.exportLog">📥 导出</button>
                <button class="btn btn-sm btn-outline" onclick="clearLlmLog()" data-i18n="qt.clearLog">🗑️ 清屏</button>
            </div>
        </div>
        <div class="card-body" style="padding: 0; flex: 1; min-height: 0; overflow: hidden;">
            <div class="qt-tab-pane active" id="pane-runlog">
                <div id="runLogContainer" class="log-container"></div>
            </div>
            <div class="qt-tab-pane" id="pane-llmlog">
                <div id="llmLogContainer" class="log-container llm-log-container"></div>
            </div>
        </div>
    </div>

    <div id="todoCard" class="card qt-panel" style="width: 200px; flex: 0 0 200px;">
        <div class="card-header" style="border-bottom: none; padding: 10px 16px; flex-shrink: 0;">
            <h3 style="font-size: 14px;" data-i18n="qt.tabTodo">任务清单</h3>
        </div>
        <div class="card-body" style="padding: 0 12px 12px; flex: 1; min-height: 0; overflow-y: auto;">
            <div id="todoTreeContainer">
                <div class="todo-empty" data-i18n="qt.noTasks">暂无任务</div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom row: Request Input -->
<div class="card">
    <div class="card-body" style="padding-top: 16px;">
        <form id="testForm">
            <div style="display: flex; gap: 12px; align-items: center;">
                <select id="requestType" class="form-control" style="width: 140px; margin: 0;">
                    <option value="auto" data-i18n="qt.autoDetect">自动识别</option>
                </select>
                <textarea id="requestInput" class="form-control" rows="2" style="flex: 1; margin: 0;"
                    placeholder="请输入您的请求..." data-i18n-placeholder="qt.requestPlaceholder"></textarea>
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="btnText" data-i18n="qt.sendRequest">发送请求</span>
                    <span id="btnSpinner" class="spinner hidden">⟳</span>
                </button>
                <button type="button" class="btn btn-outline" id="cancelBtn" style="display: none;">
                    <span data-i18n="qt.cancel">取消</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/quick_test.js?v=20260807"></script>
{% endblock %}
